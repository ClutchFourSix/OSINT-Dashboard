<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSINT Dashboard</title>  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #e6eefc;
    }

    header {
      padding: 20px;
      background: #111a2e;
      border-bottom: 1px solid #2a3b5c;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 15px;
    }

    .card {
      background: #141f36;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #2a3b5c;
    }

    .hotspot {
      cursor: pointer;
      transition: 0.2s;
    }

    .hotspot:hover {
      background: #1c2a48;
    }

    .score {
      float: right;
      font-weight: bold;
    }

    .bullish { color: #6cff6c; }
    .bearish { color: #ff6c6c; }
  </style></head><body><header>
  <h1>OSINT Market Intelligence Dashboard</h1>
</header><div class="container">  <div class="card">
    <h2>Hotspots</h2>
    <div id="hotspots"></div>
  </div>  <div class="card">
    <h2>Details</h2>
    <div id="details">Click a hotspot</div>
  </div>  <div class="card">
    <h2>Asset Impact</h2>
    <div id="assets"></div>
  </div></div><script>
const data = [
  {
    name: "Red Sea Shipping",
    score: 85,
    summary: "Shipping disruption risk",
    bullish: ["Oil", "Gold"],
    bearish: ["Equities"]
  },
  {
    name: "Ukraine War",
    score: 80,
    summary: "Ongoing conflict impact",
    bullish: ["Defense", "Gold"],
    bearish: ["EU Growth"]
  },
  {
    name: "AI Energy Demand",
    score: 70,
    summary: "Power demand surge",
    bullish: ["Copper", "Utilities"],
    bearish: []
  }
];

const hotspotDiv = document.getElementById("hotspots");
const detailsDiv = document.getElementById("details");
const assetsDiv = document.getElementById("assets");

data.forEach((h, index) => {
  const div = document.createElement("div");
  div.className = "hotspot";
  div.innerHTML = `${h.name} <span class="score">${h.score}</span>`;
  
  div.onclick = () => {
    detailsDiv.innerHTML = `<b>${h.name}</b><br>${h.summary}`;
    
    assetsDiv.innerHTML = `
      <div class="bullish">Bullish: ${h.bullish.join(", ")}</div>
      <div class="bearish">Bearish: ${h.bearish.join(", ")}</div>
    `;
  };

  hotspotDiv.appendChild(div);
});
</script></body>
</html>
