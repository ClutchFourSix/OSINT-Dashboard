<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT Market Intelligence Dashboard</title>
<style>body{margin:0;font-family:Arial;background:#0b1220;color:#e6eefc}header{padding:20px;background:#111a2e}.container{padding:15px}.card{background:#141f36;padding:15px;border-radius:10px;margin-bottom:10px}.hotspot{cursor:pointer;padding:10px;border-bottom:1px solid #2a3b5c}.hotspot:hover{background:#1c2a48}</style>
</head>
<body>
<header><h2>OSINT Intelligence System</h2></header>
<div class="container">
<div class="card"><h3>Live Feed</h3><div id="feed"></div></div>
<div class="card"><h3>Hotspots</h3><div id="hotspots"></div></div>
<div class="card"><h3>Details</h3><div id="details"></div></div>
<div class="card"><h3>Assets</h3><div id="assets"></div></div>
</div>
<script>
async function loadFeed(){const data=await fetch('data/feed.json?v='+Date.now()).then(r=>r.json());document.getElementById('feed').innerHTML=data.feed.map(f=>`<div class='card'><b>${f.title}</b><br><small>${f.source} • ${f.timestamp}</small></div>`).join('')}
async function loadData(){const h=await fetch('data/hotspots.json?v='+Date.now()).then(r=>r.json());const s=await fetch('data/system.json?v='+Date.now()).then(r=>r.json());document.getElementById('hotspots').innerHTML=h.hotspots.map(x=>`<div class='hotspot' onclick='showDetail(${JSON.stringify(x)})'>${x.name}</div>`).join('');document.getElementById('assets').innerHTML=s.assets.map(a=>`<div>${a.symbol} - ${a.aggregate_bias} - ${a.decision_context.action}</div>`).join('')}
function showDetail(h){document.getElementById('details').innerHTML=`<b>${h.name}</b><br>${h.summary}<br><br>Decision: ${h.decision?.bias||'n/a'}`}
loadFeed();loadData();
</script>
</body>
</html>
