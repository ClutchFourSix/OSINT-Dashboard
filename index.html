<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSINT Market Intelligence Dashboard</title>
  <style>
    :root{--bg:#080d14;--panel:rgba(15,24,36,.94);--panel2:rgba(22,35,52,.9);--text:#e8f1ff;--muted:#8fa4bd;--accent:#a6ff4d;--danger:#ff4d6d;--warn:#ffbf47;--blue:#4da3ff;--border:rgba(166,255,77,.18);--shadow:0 18px 40px rgba(0,0,0,.35)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top left,rgba(77,163,255,.18),transparent 28%),radial-gradient(circle at bottom right,rgba(166,255,77,.12),transparent 24%),var(--bg);color:var(--text);min-height:100vh}
    header{padding:28px 20px 16px;border-bottom:1px solid var(--border);background:rgba(5,10,18,.82)}
    .header-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;gap:20px;align-items:center}
    h1{margin:0;font-size:clamp(1.4rem,3vw,2.4rem)}
    .tagline{margin-top:8px;color:var(--muted)}
    .status-pill{border:1px solid var(--border);color:var(--accent);padding:9px 12px;border-radius:999px;font-size:.85rem;background:rgba(166,255,77,.07)}
    main{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div>
      <h1>OSINT Market Intelligence Dashboard</h1>
      <div class="tagline">Sources → Events → Hotspots → Assets → Decisions</div>
    </div>
    <div class="status-pill" id="updatedPill">Live</div>
  </div>
</header>
<main>
  <p style="color:#8fa4bd">Header is no longer fixed. Scroll behavior restored.</p>
</main>
</body>
</html>
